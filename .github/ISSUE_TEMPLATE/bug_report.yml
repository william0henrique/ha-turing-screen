name: Relatar um problema
description: Informe um erro para ajudar a reproduzi-lo e corrigi-lo.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Explique o problema sem incluir tokens ou dados pessoais.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      placeholder: Passo 1… Passo 2…
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Versão do Python
      placeholder: "3.12.0"
  - type: input
    id: hardware
    attributes:
      label: Tela / revisão
      placeholder: "Turing Smart Screen 3.5 Rev. A"
  - type: textarea
    id: logs
    attributes:
      label: Erro ou log (opcional)
      description: Remova tokens, endereços privados e informações pessoais.
