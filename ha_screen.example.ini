; Copie para ha_screen.ini e edite. O ha_screen.ini fica fora do Git (pode conter seu token).

[ha]
; URL do Home Assistant
url = http://homeassistant.local:8123
token = COLE_SEU_TOKEN_AQUI
atualizar_seg = 2

[tela]
; Pasta do projeto original turing-smart-screen-python (contém library/ e res/)
projeto = C:/tela/turing-smart-screen-python-main
porta = AUTO
revisao = A
brilho = 30
inatividade_segundos = 300

[entidades]
internet =
celular_nome = Celular
celular_bateria =
celular_carregando =
; Câmeras para monitorar: camera.entity_id=Nome, separadas por vírgula
cameras =
; Sensores de privacidade: camera.entity_id=switch.privacy_mode, separados por vírgula
camera_privacidade =

[luzes]
; Até quatro luzes: light.entity_id = Nome exibido

[controles]
tela = light.tela_turing
brilho = input_number.brilho_tela_turing
fundo = switch.fundo_fotos_tela
descanso = switch.modo_descanso_tela_turing
notificacao_id = input_number.notificacao_tela_turing_id
notificacao_titulo = input_text.notificacao_tela_turing_titulo
notificacao_mensagem = input_text.notificacao_tela_turing_mensagem
notificacao_estilo = input_text.notificacao_tela_turing_estilo

[tailscale]
ativar = nao
comando =

[player]
entidade =
mostrar_pausado = nao
modo = mini
