; Copie para ha_screen.ini e edite. O ha_screen.ini fica FORA do git (contem seu token).

[ha]
; Endereco do Home Assistant (o mesmo que voce abre no navegador)
url = http://homeassistant.local:8123
; HA > seu perfil > Seguranca > Tokens de acesso de longa duracao
token = COLE_SEU_TOKEN_AQUI
; Intervalo de consulta em segundos (menor = atualiza mais rapido)
atualizar_seg = 2

[tela]
; Pasta do projeto turing-smart-screen-python (onde ficam main.py e "library").
; Pode ser caminho absoluto ou relativo a este arquivo.
projeto = C:\tela\turing-smart-screen-python-main
; COM3, COM4... ou AUTO
porta = COM3
; A = Turing 3.5" | B = XuanFang 3.5"
revisao = A
; 0-100. Na revisao A mantenha ate ~50 para nao esquentar
brilho = 30

[entidades]
; Deixe em branco (ou apague a linha) o que voce nao quer mostrar.
; Binary sensor "on" = online (ex.: status WAN do roteador)
internet = binary_sensor.roteador_wan_status
celular_nome = Cel. Fulano
celular_bateria = sensor.celular_battery_level
; Sensor que vale "charging" quando esta carregando
celular_carregando = sensor.celular_battery_state
; Aviso de bateria fraca no celular (percentual)
celular_alerta_bateria = 10

[alertas]
; Tempo visivel e intervalo de repeticao enquanto a condicao continuar
duracao_seg = 7
repetir_min = 30

[player]
; Quando este media_player estiver TOCANDO, aparece o player (capa, musica e artista,
; sem barra de progresso). Deixe em branco para desativar.
; Funciona com Spotify ou qualquer media_player do HA.
entidade = media_player.spotify_fulano
; mini = ocupa o espaco largo do painel (no lugar do Tailscale)
; tela_cheia = troca a tela inteira pelo player
modo = mini
; sim = tambem mostra o player quando a musica estiver pausada
mostrar_pausado = nao

[tailscale]
; Quando NAO esta tocando musica, o espaco largo mostra o estado do Tailscale deste PC
; (le a CLI "tailscale status --json"). Use "nao" para esconder.
ativar = sim
; Caminho da CLI, se nao for encontrada sozinha. Ex.: C:\Program Files\Tailscale\tailscale.exe
comando =

[luzes]
; Ate 4 luzes/LEDs: entity_id = nome na tela. Entidades coloridas usam RGB/HS na barra.
light.sala = Sala
light.luminaria = Luminaria
switch.corredor = Corredor
switch.led = LED

[cameras]
; Cameras monitoradas para aviso quando ficarem indisponiveis
camera.minha_camera = Minha camera
