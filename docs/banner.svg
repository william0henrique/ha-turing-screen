<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HA Turing Screen</title><desc id="desc">Painel Home Assistant para Turing Smart Screen, com estética tecnológica azul e ciano.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#101b39"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48e4ff"/><stop offset="1" stop-color="#4285ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#76caff" stroke-opacity=".09"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1000" cy="180" r="190" fill="#1c5fff" opacity=".08"/><circle cx="1000" cy="180" r="130" fill="none" stroke="#46dfff" stroke-opacity=".18"/>
  <g transform="translate(790 78)" filter="url(#glow)">
