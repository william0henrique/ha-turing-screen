    <rect x="13" y="13" width="284" height="178" rx="10" fill="#0d1b31" stroke="#264a71"/>
    <path d="M32 53H278M32 160H278" stroke="#25486a"/>
    <text x="34" y="42" fill="#75eaff" font-family="monospace" font-size="15">HOME ASSISTANT / STATUS</text>
    <text x="34" y="92" fill="#f0f8ff" font-family="monospace" font-size="32" font-weight="700">18:42</text>
    <circle cx="44" cy="123" r="6" fill="#4de6a5"/><text x="59" y="128" fill="#b4cbe2" font-family="monospace" font-size="14">CASA ONLINE</text>
    <path d="M205 108v30m-10-20h20m-16-8 12 16m0-16-12 16" stroke="#55dfff" stroke-width="2" fill="none"/>
    <rect x="33" y="174" width="50" height="5" rx="2" fill="#43dcff"/><rect x="91" y="174" width="50" height="5" rx="2" fill="#4285ff"/><rect x="149" y="174" width="50" height="5" rx="2" fill="#43dcff"/>
  </g>
  <g transform="translate(76 74)">
