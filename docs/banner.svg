    <text x="31" y="27" fill="#59e4ff" font-family="monospace" font-size="17" letter-spacing="4">SMART HOME DISPLAY</text>
    <text x="31" y="91" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">HA Turing</text>
    <text x="31" y="151" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Screen<span fill="#4bdfff">.</span></text>
    <text x="32" y="187" fill="#a7bed7" font-family="Arial, Helvetica, sans-serif" font-size="19">Home Assistant • Python • USB Display</text>
  </g>
